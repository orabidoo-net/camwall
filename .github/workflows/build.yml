name: Build Camwall Deb Package

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    # Version zentral definieren – hier für Release 1.7.1
    env:
      VERSION: "1.7.1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev python3 python3-gi python3-pip

      - name: Build Camwall Package
        run: |
          make build VERSION=${VERSION}

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: camwall-deb
          path: camwall_${VERSION}_amd64.deb

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: camwall_${VERSION}_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
