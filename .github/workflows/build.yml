name: Build Camwall Deb Package

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Debug HOME path
      run: |
        echo "HOME is: $HOME"
        ls -l $HOME
  

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev python3 python3-gi python3-pip

    - name: Build Camwall Package
      run: |
        make build VERSION=${{ env.VERSION }}

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: camwall-deb
        path: ${{ env.HOME }}/camwall_${{ env.VERSION }}_amd64.deb

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.HOME }}/camwall_${{ env.VERSION }}_amd64.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
