name: Build Camwall Deb Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev python3 python3-gi python3-pip

    - name: Build Camwall Package
      run: |
        make build VERSION=1.7

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: camwall-deb
        path: ~/camwall_1.7_amd64.deb

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: ~/camwall_1.7_amd64.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
