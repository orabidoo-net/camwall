name: Build Camwall Deb Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # --- Checkout Repository ---
    - name: Checkout Repository
      uses: actions/checkout@v4

    # --- Extract VERSION from tag ---
    - name: Extract version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        VERSION="${VERSION#v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Detected VERSION=$VERSION"

    # --- Debug HOME & workspace path ---
    - name: Debug HOME path
      run: |
        echo "HOME = $HOME"
        echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
        ls -l $HOME
        ls -l $GITHUB_WORKSPACE

    # --- Install dependencies ---
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev python3 python3-gi python3-pip

    # --- Build the package ---
    - name: Build Camwall Package
      run: |
        make build VERSION="${{ steps.version.outputs.version }}"
        mv $HOME/camwall_${{ steps.version.outputs.version }}_amd64.deb $GITHUB_WORKSPACE/

    # --- Upload Artifact ---
    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: camwall-deb
        path: camwall_${{ steps.version.outputs.version }}_amd64.deb

    # --- Create GitHub Release ---
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: camwall_${{ steps.version.outputs.version }}_amd64.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
